name: Connection Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    env:
      TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}

    steps:
      - name: Test Connection
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_IP)) {
            Write-Error "TAILSCALE_IP secret is missing or empty."
            exit 1
          }

          Write-Host "Testing connection to configured address..."
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to port 3389 failed."
            exit 1
          }

          Write-Host "TCP connectivity successful!"
